<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prismatic Recursion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section { margin-bottom: 32px; }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '\2022';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button { margin-bottom: 0; }

        .control-group { margin-bottom: 20px; }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active { transform: translateY(0); }

        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }

        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Prismatic Recursion</h1>
            <div class="subtitle">Fractal light decomposition through recursive branching. Each generation splits the chromatic spectrum further.</div>

            <!-- Seed Section (FIXED) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">&larr; Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next &rarr;</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">&#8635; Random</button>
            </div>

            <!-- Parameters Section (VARIABLE) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Recursion Depth</label>
                    <div class="slider-container">
                        <input type="range" id="maxDepth" min="2" max="7" step="1" value="5" oninput="updateParam('maxDepth', this.value)">
                        <span class="value-display" id="maxDepth-value">5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Branch Count</label>
                    <div class="slider-container">
                        <input type="range" id="branchCount" min="2" max="5" step="1" value="3" oninput="updateParam('branchCount', this.value)">
                        <span class="value-display" id="branchCount-value">3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Organism Count</label>
                    <div class="slider-container">
                        <input type="range" id="organismCount" min="1" max="6" step="1" value="3" oninput="updateParam('organismCount', this.value)">
                        <span class="value-display" id="organismCount-value">3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Color Shift Speed</label>
                    <div class="slider-container">
                        <input type="range" id="colorSpeed" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updateParam('colorSpeed', this.value)">
                        <span class="value-display" id="colorSpeed-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Rotation Speed</label>
                    <div class="slider-container">
                        <input type="range" id="rotationSpeed" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updateParam('rotationSpeed', this.value)">
                        <span class="value-display" id="rotationSpeed-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Branch Scale</label>
                    <div class="slider-container">
                        <input type="range" id="branchScale" min="0.5" max="0.85" step="0.01" value="0.67" oninput="updateParam('branchScale', this.value)">
                        <span class="value-display" id="branchScale-value">0.67</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="trailOpacity" min="5" max="60" step="1" value="18" oninput="updateParam('trailOpacity', this.value)">
                        <span class="value-display" id="trailOpacity-value">18</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Spread Angle</label>
                    <div class="slider-container">
                        <input type="range" id="spreadAngle" min="15" max="120" step="1" value="60" oninput="updateParam('spreadAngle', this.value)">
                        <span class="value-display" id="spreadAngle-value">60&deg;</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (FIXED) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom:8px;">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ===================================================================
        // PARAMETERS
        // ===================================================================

        const GOLDEN_ANGLE = 137.508; // degrees - phyllotaxis angle

        let params = {
            seed: 12345,
            maxDepth: 5,
            branchCount: 3,
            organismCount: 3,
            colorSpeed: 1.0,
            rotationSpeed: 1.0,
            branchScale: 0.67,
            trailOpacity: 18,
            spreadAngle: 60
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // ===================================================================
        // FRACTAL ORGANISM CLASS
        // ===================================================================

        class FractalOrganism {
            constructor(x, y, baseLen, baseHue, phaseOffset, rotOffset) {
                this.x = x;
                this.y = y;
                this.baseLen = baseLen;
                this.baseHue = baseHue;
                this.phaseOffset = phaseOffset;
                this.rotOffset = rotOffset;
            }
        }

        let organisms = [];
        let time = 0;

        // ===================================================================
        // P5.JS ALGORITHM
        // ===================================================================

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            colorMode(HSB, 360, 100, 100, 100);
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            time = 0;
            organisms = [];

            let count = params.organismCount;
            for (let i = 0; i < count; i++) {
                let angle = (TWO_PI / count) * i + random(-0.3, 0.3);
                let dist = random(80, 200);
                let ox = width / 2 + cos(angle) * dist;
                let oy = height / 2 + sin(angle) * dist;
                let baseLen = random(100, 180);
                let baseHue = (i * GOLDEN_ANGLE + random(0, 30)) % 360;
                let phaseOffset = random(0, TWO_PI);
                let rotOffset = random(-PI, PI);
                organisms.push(new FractalOrganism(ox, oy, baseLen, baseHue, phaseOffset, rotOffset));
            }

            background(0, 0, 5);
        }

        function draw() {
            // Semi-transparent overlay for trails
            noStroke();
            fill(0, 0, 5, params.trailOpacity);
            rect(0, 0, width, height);

            time += 0.008 * params.rotationSpeed;

            for (let org of organisms) {
                push();
                translate(org.x, org.y);
                rotate(org.rotOffset + time * 0.3);

                drawBranch(
                    org.baseLen,
                    0,
                    org.baseHue,
                    org.phaseOffset,
                    time
                );
                pop();
            }
        }

        function drawBranch(len, depth, hue, phase, t) {
            if (depth >= params.maxDepth || len < 2) return;

            // Oscillating angle offset per depth
            let breathe = sin(t * 1.7 + phase + depth * 0.8) * 0.3;
            let lenMod = len * (1.0 + sin(t * 0.9 + phase + depth * 1.1) * 0.08);

            // Color: prismatic decomposition via golden angle
            let h = (hue + depth * GOLDEN_ANGLE * params.colorSpeed + t * 25 * params.colorSpeed) % 360;
            let s = map(depth, 0, params.maxDepth, 60, 95);
            let b = map(depth, 0, params.maxDepth, 100, 70);
            let a = map(depth, 0, params.maxDepth, 90, 40);

            // Stroke weight thins with depth
            let sw = map(depth, 0, params.maxDepth, 4.5, 0.6);
            strokeWeight(sw);
            stroke(h, s, b, a);

            // Draw the branch segment
            line(0, 0, 0, -lenMod);

            // Move to end of branch
            translate(0, -lenMod);

            // Branch into children
            let count = params.branchCount;
            let spreadRad = radians(params.spreadAngle);
            let totalSpread = spreadRad * (1.0 + breathe * 0.4);

            for (let i = 0; i < count; i++) {
                let frac = count === 1 ? 0 : (i / (count - 1)) - 0.5;
                let childAngle = frac * totalSpread;

                // Add subtle noise perturbation
                let nVal = noise(depth * 0.5 + i * 10 + t * 0.3 + phase);
                childAngle += (nVal - 0.5) * 0.4;

                push();
                rotate(childAngle + breathe * 0.2);
                drawBranch(
                    lenMod * params.branchScale,
                    depth + 1,
                    h,
                    phase + i * 0.5,
                    t
                );
                pop();
            }
        }

        // ===================================================================
        // UI CONTROL HANDLERS
        // ===================================================================

        function updateParam(paramName, value) {
            let numVal = parseFloat(value);
            if (paramName === 'maxDepth' || paramName === 'branchCount' ||
                paramName === 'organismCount' || paramName === 'trailOpacity' ||
                paramName === 'spreadAngle') {
                numVal = parseInt(value);
            }
            params[paramName] = numVal;
            let displayVal = value;
            if (paramName === 'spreadAngle') displayVal = value + '\u00B0';
            document.getElementById(paramName + '-value').textContent = displayVal;

            if (paramName === 'organismCount') {
                initializeSystem();
            }
        }

        // ===================================================================
        // SEED CONTROLS (FIXED)
        // ===================================================================

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            document.getElementById('maxDepth').value = params.maxDepth;
            document.getElementById('maxDepth-value').textContent = params.maxDepth;
            document.getElementById('branchCount').value = params.branchCount;
            document.getElementById('branchCount-value').textContent = params.branchCount;
            document.getElementById('organismCount').value = params.organismCount;
            document.getElementById('organismCount-value').textContent = params.organismCount;
            document.getElementById('colorSpeed').value = params.colorSpeed;
            document.getElementById('colorSpeed-value').textContent = params.colorSpeed;
            document.getElementById('rotationSpeed').value = params.rotationSpeed;
            document.getElementById('rotationSpeed-value').textContent = params.rotationSpeed;
            document.getElementById('branchScale').value = params.branchScale;
            document.getElementById('branchScale-value').textContent = params.branchScale;
            document.getElementById('trailOpacity').value = params.trailOpacity;
            document.getElementById('trailOpacity-value').textContent = params.trailOpacity;
            document.getElementById('spreadAngle').value = params.spreadAngle;
            document.getElementById('spreadAngle-value').textContent = params.spreadAngle + '\u00B0';
            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('prismatic-recursion-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
