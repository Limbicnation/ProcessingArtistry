<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetic Morphogenesis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section { margin-bottom: 32px; }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '\2022';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button { margin-bottom: 0; }

        .control-group { margin-bottom: 20px; }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .color-group { margin-bottom: 16px; }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active { transform: translateY(0); }

        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }

        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: #050510;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Synthetic Morphogenesis</h1>
            <div class="subtitle">Bioluminescent fractal organisms breathing through recursive tentacles. Each seed grows a unique species.</div>

            <!-- Seed Section (FIXED) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">&larr; Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next &rarr;</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">&#8635; Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Tentacle Depth</label>
                    <div class="slider-container">
                        <input type="range" id="tentacleDepth" min="2" max="7" step="1" value="5" oninput="updateParam('tentacleDepth', this.value)">
                        <span class="value-display" id="tentacleDepth-value">5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Tentacle Count</label>
                    <div class="slider-container">
                        <input type="range" id="tentacleCount" min="3" max="12" step="1" value="6" oninput="updateParam('tentacleCount', this.value)">
                        <span class="value-display" id="tentacleCount-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Organism Count</label>
                    <div class="slider-container">
                        <input type="range" id="organismCount" min="1" max="5" step="1" value="3" oninput="updateParam('organismCount', this.value)">
                        <span class="value-display" id="organismCount-value">3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Breath Rate</label>
                    <div class="slider-container">
                        <input type="range" id="breathRate" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateParam('breathRate', this.value)">
                        <span class="value-display" id="breathRate-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Color Shift Speed</label>
                    <div class="slider-container">
                        <input type="range" id="colorSpeed" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updateParam('colorSpeed', this.value)">
                        <span class="value-display" id="colorSpeed-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Drift Speed</label>
                    <div class="slider-container">
                        <input type="range" id="driftSpeed" min="0.0" max="2.0" step="0.1" value="0.5" oninput="updateParam('driftSpeed', this.value)">
                        <span class="value-display" id="driftSpeed-value">0.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Body Size</label>
                    <div class="slider-container">
                        <input type="range" id="bodySize" min="20" max="80" step="2" value="40" oninput="updateParam('bodySize', this.value)">
                        <span class="value-display" id="bodySize-value">40</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Persistence</label>
                    <div class="slider-container">
                        <input type="range" id="trailAlpha" min="3" max="40" step="1" value="10" oninput="updateParam('trailAlpha', this.value)">
                        <span class="value-display" id="trailAlpha-value">10</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Branch Spread</label>
                    <div class="slider-container">
                        <input type="range" id="branchSpread" min="0.2" max="1.5" step="0.05" value="0.7" oninput="updateParam('branchSpread', this.value)">
                        <span class="value-display" id="branchSpread-value">0.7</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Bioluminescence</h3>

                <div class="color-group">
                    <label>Core Glow</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#00e5ff" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#00e5ff</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Tentacle Hue</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#ff00cc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#ff00cc</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Accent Pulse</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#3366ff" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#3366ff</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (FIXED) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom:8px;">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Growing organisms...</div>
            </div>
        </div>
    </div>

    <script>
        // ===================================================================
        // PARAMETERS
        // ===================================================================

        const GOLDEN_ANGLE = 137.508;
        const PHI = 1.6180339887;

        let params = {
            seed: 12345,
            tentacleDepth: 5,
            tentacleCount: 6,
            organismCount: 3,
            breathRate: 1.0,
            colorSpeed: 1.0,
            driftSpeed: 0.5,
            bodySize: 40,
            trailAlpha: 10,
            branchSpread: 0.7,
            colors: ['#00e5ff', '#ff00cc', '#3366ff']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // ===================================================================
        // ORGANISM CLASS
        // ===================================================================

        class Organism {
            constructor(index, total) {
                // Position: distribute around center with noise offset
                let angle = (TWO_PI / total) * index + random(-0.5, 0.5);
                let dist = random(150, 350);
                this.x = width / 2 + cos(angle) * dist;
                this.y = height / 2 + sin(angle) * dist;

                // Species traits (seeded)
                this.symmetry = floor(random(3, params.tentacleCount + 1));
                this.baseHue = (index * GOLDEN_ANGLE + random(0, 60)) % 360;
                this.phaseOffset = random(0, TWO_PI);
                this.bodyRadius = params.bodySize * random(0.8, 1.3);
                this.pulseFreq = random(0.8, 1.5);
                this.tentacleLen = random(60, 120);

                // Drift noise offsets
                this.noiseOffX = random(0, 1000);
                this.noiseOffY = random(0, 1000);
                this.driftAngle = random(TWO_PI);
            }

            update(t) {
                // Perlin noise drift
                let nx = noise(this.noiseOffX + t * 0.15 * params.driftSpeed);
                let ny = noise(this.noiseOffY + t * 0.15 * params.driftSpeed);
                this.x += (nx - 0.5) * 2.0 * params.driftSpeed;
                this.y += (ny - 0.5) * 2.0 * params.driftSpeed;

                // Soft boundary wrapping
                let margin = 100;
                if (this.x < -margin) this.x = width + margin;
                if (this.x > width + margin) this.x = -margin;
                if (this.y < -margin) this.y = height + margin;
                if (this.y > height + margin) this.y = -margin;
            }

            draw(t) {
                push();
                translate(this.x, this.y);

                let breathCycle = t * params.breathRate * this.pulseFreq + this.phaseOffset;

                // Draw body: pulsing radial form
                this.drawBody(breathCycle, t);

                // Draw tentacles
                for (let i = 0; i < this.symmetry; i++) {
                    let tentAngle = (TWO_PI / this.symmetry) * i;
                    // Add gentle sway
                    tentAngle += sin(breathCycle * PHI + i) * 0.15;

                    push();
                    rotate(tentAngle);
                    translate(0, -this.bodyRadius * (0.8 + sin(breathCycle) * 0.15));
                    this.drawTentacle(this.tentacleLen, 0, breathCycle, i, t);
                    pop();
                }

                pop();
            }

            drawBody(breathCycle, t) {
                // Pulsing body with sine-modulated lobes
                let pulse = 1.0 + sin(breathCycle) * 0.12;
                let r = this.bodyRadius * pulse;
                let lobes = this.symmetry;

                // Core glow
                let coreCol = hexToHSB(params.colors[0]);
                let hShift = (t * 10 * params.colorSpeed + this.baseHue) % 360;

                // Outer glow halo
                noStroke();
                for (let g = 3; g >= 0; g--) {
                    let glowR = r * (1.5 + g * 0.5);
                    let alpha = map(g, 0, 3, 15, 3);
                    fill((coreCol.h + hShift) % 360, coreCol.s * 0.5, coreCol.b, alpha);
                    beginShape();
                    for (let a = 0; a <= TWO_PI; a += 0.05) {
                        let lobeWobble = sin(a * lobes + breathCycle) * 0.25 + 1.0;
                        let px = cos(a) * glowR * lobeWobble;
                        let py = sin(a) * glowR * lobeWobble;
                        vertex(px, py);
                    }
                    endShape(CLOSE);
                }

                // Solid body
                for (let layer = 2; layer >= 0; layer--) {
                    let layerR = r * (0.4 + layer * 0.3);
                    let alpha = map(layer, 0, 2, 80, 25);
                    let sat = map(layer, 0, 2, 70, 90);
                    fill((coreCol.h + hShift + layer * 20) % 360, sat, coreCol.b, alpha);
                    beginShape();
                    for (let a = 0; a <= TWO_PI; a += 0.05) {
                        let lobeWobble = sin(a * lobes + breathCycle + layer * 0.3) * 0.2 + 1.0;
                        let px = cos(a) * layerR * lobeWobble;
                        let py = sin(a) * layerR * lobeWobble;
                        vertex(px, py);
                    }
                    endShape(CLOSE);
                }

                // Bright core point
                fill((coreCol.h + hShift) % 360, 30, 100, 60);
                ellipse(0, 0, r * 0.3, r * 0.3);
            }

            drawTentacle(len, depth, breathCycle, tentIndex, t) {
                if (depth >= params.tentacleDepth || len < 3) return;

                // Breathing wave along the tentacle
                let wave = sin(breathCycle * PHI + depth * 0.9 + tentIndex * 0.7) * params.branchSpread * 0.5;
                let segLen = len * (0.9 + sin(breathCycle + depth * 1.3) * 0.08);

                // Color: golden angle decomposition through depth
                let h = (this.baseHue + depth * GOLDEN_ANGLE * params.colorSpeed + t * 20 * params.colorSpeed) % 360;
                let s = map(depth, 0, params.tentacleDepth, 80, 95);
                let b = map(depth, 0, params.tentacleDepth, 100, 55);
                let a = map(depth, 0, params.tentacleDepth, 70, 15);

                // Stroke: thins with depth
                let sw = map(depth, 0, params.tentacleDepth, 3.5, 0.4);
                strokeWeight(sw);
                stroke(h, s, b, a);
                noFill();

                // Draw curved segment using quadratic bezier
                let endX = sin(wave) * segLen * 0.3;
                let endY = -segLen;
                let ctrlX = sin(wave + breathCycle * 0.3) * segLen * 0.5;
                let ctrlY = -segLen * 0.5;

                beginShape();
                vertex(0, 0);
                quadraticVertex(ctrlX, ctrlY, endX, endY);
                endShape();

                // Bioluminescent node at joints
                if (depth < 3) {
                    noStroke();
                    let nodeAlpha = map(depth, 0, 2, 40, 15);
                    fill(h, s * 0.6, 100, nodeAlpha);
                    ellipse(endX, endY, sw * 3, sw * 3);
                }

                // Recursive branching
                push();
                translate(endX, endY);

                // Primary continuation
                let continuationAngle = wave * 0.6;
                push();
                rotate(continuationAngle);
                this.drawTentacle(segLen * 0.72, depth + 1, breathCycle, tentIndex, t);
                pop();

                // Secondary branch (with probability decreasing by depth)
                if (depth < params.tentacleDepth - 1) {
                    let branchAngle = params.branchSpread * (depth % 2 === 0 ? 1 : -1);
                    branchAngle += sin(breathCycle + depth * 2) * 0.2;
                    push();
                    rotate(branchAngle);
                    this.drawTentacle(segLen * 0.55, depth + 1, breathCycle + 0.5, tentIndex, t);
                    pop();
                }

                pop();
            }
        }

        // ===================================================================
        // UTILITY
        // ===================================================================

        function hexToHSB(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;
            let mx = Math.max(r, g, b), mn = Math.min(r, g, b);
            let h = 0, s, v = mx;
            let d = mx - mn;
            s = mx === 0 ? 0 : d / mx;
            if (mx !== mn) {
                if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
                else if (mx === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h /= 6;
            }
            return { h: h * 360, s: s * 100, b: v * 100 };
        }

        // ===================================================================
        // P5.JS LIFECYCLE
        // ===================================================================

        let organisms = [];
        let time = 0;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            colorMode(HSB, 360, 100, 100, 100);
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            time = 0;
            organisms = [];

            for (let i = 0; i < params.organismCount; i++) {
                organisms.push(new Organism(i, params.organismCount));
            }

            background(240, 40, 4);
        }

        function draw() {
            // Semi-transparent overlay for bioluminescent trails
            noStroke();
            fill(240, 40, 4, params.trailAlpha);
            rect(0, 0, width, height);

            time += 0.012;

            for (let org of organisms) {
                org.update(time);
                org.draw(time);
            }
        }

        // ===================================================================
        // UI HANDLERS
        // ===================================================================

        function updateParam(paramName, value) {
            let numVal = parseFloat(value);
            if (['tentacleDepth', 'tentacleCount', 'organismCount', 'bodySize', 'trailAlpha'].includes(paramName)) {
                numVal = parseInt(value);
            }
            params[paramName] = numVal;
            document.getElementById(paramName + '-value').textContent = value;

            if (paramName === 'organismCount' || paramName === 'tentacleCount' || paramName === 'bodySize') {
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            let idx = parseInt(colorId.replace('color', '')) - 1;
            params.colors[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        // ===================================================================
        // SEED CONTROLS (FIXED)
        // ===================================================================

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            document.getElementById('tentacleDepth').value = params.tentacleDepth;
            document.getElementById('tentacleDepth-value').textContent = params.tentacleDepth;
            document.getElementById('tentacleCount').value = params.tentacleCount;
            document.getElementById('tentacleCount-value').textContent = params.tentacleCount;
            document.getElementById('organismCount').value = params.organismCount;
            document.getElementById('organismCount-value').textContent = params.organismCount;
            document.getElementById('breathRate').value = params.breathRate;
            document.getElementById('breathRate-value').textContent = params.breathRate;
            document.getElementById('colorSpeed').value = params.colorSpeed;
            document.getElementById('colorSpeed-value').textContent = params.colorSpeed;
            document.getElementById('driftSpeed').value = params.driftSpeed;
            document.getElementById('driftSpeed-value').textContent = params.driftSpeed;
            document.getElementById('bodySize').value = params.bodySize;
            document.getElementById('bodySize-value').textContent = params.bodySize;
            document.getElementById('trailAlpha').value = params.trailAlpha;
            document.getElementById('trailAlpha-value').textContent = params.trailAlpha;
            document.getElementById('branchSpread').value = params.branchSpread;
            document.getElementById('branchSpread-value').textContent = params.branchSpread;

            document.getElementById('color1').value = params.colors[0];
            document.getElementById('color1-value').textContent = params.colors[0];
            document.getElementById('color2').value = params.colors[1];
            document.getElementById('color2-value').textContent = params.colors[1];
            document.getElementById('color3').value = params.colors[2];
            document.getElementById('color3-value').textContent = params.colors[2];

            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('synthetic-morphogenesis-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
