<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropic Signal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20,20,19,0.1);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px; font-weight: 600; color: var(--anthropic-dark);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .control-section h3::before { content: '\2022'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input {
            width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray); text-align: center;
        }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217,119,87,0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] {
            flex: 1; height: 4px; background: var(--anthropic-light-gray);
            border-radius: 2px; outline: none; -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; transition: all 0.2s ease;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; background: var(--anthropic-orange);
            border-radius: 50%; border: none; cursor: pointer; transition: all 0.2s ease;
        }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .button {
            background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px;
            border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.2s ease; width: 100%;
        }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container {
            width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(20,20,19,0.1); background: #0a0a0a;
        }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; padding: 40px; font-size: 18px; color: var(--anthropic-mid-gray); }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Entropic Signal</h1>
            <div class="subtitle">Procedural glitch aesthetics — RGB fracture, pixel sorting, and scanline displacement synchronized through oscillating corruption.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">&larr; Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next &rarr;</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">&#8635; Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="100" max="800" step="50" value="400" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">400</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>RGB Split Intensity</label>
                    <div class="slider-container">
                        <input type="range" id="rgbSplit" min="0" max="30" step="1" value="12" oninput="updateParam('rgbSplit', this.value)">
                        <span class="value-display" id="rgbSplit-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Pixel Sort Amount</label>
                    <div class="slider-container">
                        <input type="range" id="sortAmount" min="0" max="100" step="5" value="50" oninput="updateParam('sortAmount', this.value)">
                        <span class="value-display" id="sortAmount-value">50%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Scanline Jitter</label>
                    <div class="slider-container">
                        <input type="range" id="scanlineJitter" min="0" max="40" step="1" value="15" oninput="updateParam('scanlineJitter', this.value)">
                        <span class="value-display" id="scanlineJitter-value">15</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Glitch Rhythm</label>
                    <div class="slider-container">
                        <input type="range" id="glitchSpeed" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateParam('glitchSpeed', this.value)">
                        <span class="value-display" id="glitchSpeed-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Sort Threshold Low</label>
                    <div class="slider-container">
                        <input type="range" id="sortThreshLow" min="0" max="100" step="5" value="25" oninput="updateParam('sortThreshLow', this.value)">
                        <span class="value-display" id="sortThreshLow-value">25</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Sort Threshold High</label>
                    <div class="slider-container">
                        <input type="range" id="sortThreshHigh" min="100" max="255" step="5" value="200" oninput="updateParam('sortThreshHigh', this.value)">
                        <span class="value-display" id="sortThreshHigh-value">200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Length</label>
                    <div class="slider-container">
                        <input type="range" id="trailAlpha" min="5" max="60" step="1" value="15" oninput="updateParam('trailAlpha', this.value)">
                        <span class="value-display" id="trailAlpha-value">15</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom:8px;">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Corrupting signal...</div>
            </div>
        </div>
    </div>

    <script>
        // ===================================================================
        // PARAMETERS
        // ===================================================================

        let params = {
            seed: 12345,
            particleCount: 400,
            rgbSplit: 12,
            sortAmount: 50,
            scanlineJitter: 15,
            glitchSpeed: 1.0,
            sortThreshLow: 25,
            sortThreshHigh: 200,
            trailAlpha: 15
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // ===================================================================
        // PARTICLE CLASS — the substrate signal
        // ===================================================================

        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.sz = random(4, 20);
                this.hue = random(360);
                this.shapeType = floor(random(5));
            }

            update(t) {
                let nX = noise(this.pos.x * 0.005, this.pos.y * 0.005, t * 0.3);
                let nY = noise(this.pos.x * 0.005 + 100, this.pos.y * 0.005 + 100, t * 0.3);
                this.vel.x = map(nX, 0, 1, -1.5, 1.5);
                this.vel.y = map(nY, 0, 1, -1.5, 1.5);
                this.pos.add(this.vel);

                if (this.pos.x < 0) this.pos.x += width;
                if (this.pos.x > width) this.pos.x -= width;
                if (this.pos.y < 0) this.pos.y += height;
                if (this.pos.y > height) this.pos.y -= height;

                this.hue = (this.hue + 0.5) % 360;
                this.sz = 10 + 8 * sin(t * 2 + this.pos.x * 0.02 + this.pos.y * 0.02);
            }

            display() {
                push();
                translate(this.pos.x, this.pos.y);
                noStroke();
                fill(this.hue, 80, 95, 60);
                switch (this.shapeType) {
                    case 0: ellipse(0, 0, this.sz, this.sz); break;
                    case 1: rectMode(CENTER); rect(0, 0, this.sz, this.sz); break;
                    case 2: triangle(-this.sz/2, this.sz/2, this.sz/2, this.sz/2, 0, -this.sz/2); break;
                    case 3: this.drawHexagon(); break;
                    case 4: this.drawStar(); break;
                }
                pop();
            }

            drawHexagon() {
                let r = this.sz / 2;
                beginShape();
                for (let i = 0; i < 6; i++) {
                    let a = TWO_PI / 6 * i - PI / 6;
                    vertex(cos(a) * r, sin(a) * r);
                }
                endShape(CLOSE);
            }

            drawStar() {
                let inner = this.sz * 0.4, outer = this.sz * 0.5;
                beginShape();
                for (let i = 0; i < 10; i++) {
                    let r = i % 2 === 0 ? outer : inner;
                    let a = TWO_PI / 5 * i - HALF_PI;
                    vertex(cos(a) * r, sin(a) * r);
                }
                endShape(CLOSE);
            }
        }

        // ===================================================================
        // GLITCH ENGINE
        // ===================================================================

        // RGB Channel Split — displaces R and B channels from the composite
        function applyRGBSplit(t) {
            let maxShift = params.rgbSplit;
            if (maxShift === 0) return;

            // Oscillating displacement vectors
            let dx = sin(t * 1.7 * params.glitchSpeed) * maxShift;
            let dy = cos(t * 2.3 * params.glitchSpeed) * maxShift * 0.5;
            let dx2 = sin(t * 1.3 * params.glitchSpeed + 2) * maxShift;
            let dy2 = cos(t * 1.9 * params.glitchSpeed + 2) * maxShift * 0.5;

            loadPixels();
            let src = new Uint8ClampedArray(pixels);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let idx = (y * width + x) * 4;

                    // Red channel: shifted by (dx, dy)
                    let rx = constrain(floor(x + dx), 0, width - 1);
                    let ry = constrain(floor(y + dy), 0, height - 1);
                    let rIdx = (ry * width + rx) * 4;
                    pixels[idx] = src[rIdx]; // R

                    // Green: stays in place
                    pixels[idx + 1] = src[idx + 1]; // G

                    // Blue channel: shifted opposite
                    let bx = constrain(floor(x + dx2), 0, width - 1);
                    let by = constrain(floor(y + dy2), 0, height - 1);
                    let bIdx = (by * width + bx) * 4;
                    pixels[idx + 2] = src[bIdx + 2]; // B
                }
            }
            updatePixels();
        }

        // Pixel Sorting — sorts horizontal spans by brightness within threshold
        function applyPixelSort(t) {
            if (params.sortAmount === 0) return;

            // Oscillating thresholds
            let breathe = sin(t * 0.8 * params.glitchSpeed) * 0.3 + 0.7;
            let tLow = params.sortThreshLow * breathe;
            let tHigh = params.sortThreshHigh * breathe;

            // Only sort a percentage of rows
            let rowsToSort = floor(height * params.sortAmount / 100);

            loadPixels();

            for (let i = 0; i < rowsToSort; i++) {
                // Select rows based on noise for organic distribution
                let y = floor(noise(i * 0.1 + t) * height);
                y = constrain(y, 0, height - 1);

                // Extract row, find sortable spans
                let row = [];
                for (let x = 0; x < width; x++) {
                    let idx = (y * width + x) * 4;
                    let br = (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 3;
                    row.push({ x: x, r: pixels[idx], g: pixels[idx+1], b: pixels[idx+2], a: pixels[idx+3], br: br });
                }

                // Find spans within threshold and sort them
                let spanStart = -1;
                for (let x = 0; x <= width; x++) {
                    let inRange = x < width && row[x].br > tLow && row[x].br < tHigh;
                    if (inRange && spanStart === -1) {
                        spanStart = x;
                    } else if (!inRange && spanStart !== -1) {
                        // Sort this span by brightness
                        let span = row.slice(spanStart, x);
                        span.sort((a, b) => a.br - b.br);
                        for (let j = 0; j < span.length; j++) {
                            row[spanStart + j] = span[j];
                        }
                        spanStart = -1;
                    }
                }

                // Write sorted row back
                for (let x = 0; x < width; x++) {
                    let idx = (y * width + x) * 4;
                    pixels[idx] = row[x].r;
                    pixels[idx+1] = row[x].g;
                    pixels[idx+2] = row[x].b;
                    pixels[idx+3] = row[x].a;
                }
            }
            updatePixels();
        }

        // Scanline Displacement — horizontal slicing with jitter
        function applyScanlines(t) {
            let maxJitter = params.scanlineJitter;
            if (maxJitter === 0) return;

            loadPixels();
            let src = new Uint8ClampedArray(pixels);

            // Band parameters modulated by time
            let bandHeight = floor(8 + sin(t * 1.1 * params.glitchSpeed) * 6);
            bandHeight = max(2, bandHeight);

            for (let y = 0; y < height; y++) {
                let band = floor(y / bandHeight);
                // Noise-driven jitter per band
                let jitter = floor((noise(band * 0.3 + t * 0.5 * params.glitchSpeed) - 0.5) * 2 * maxJitter);

                // Probability of displacement based on oscillator
                let prob = sin(t * 2.7 * params.glitchSpeed + band * 0.2) * 0.5 + 0.5;
                if (random() > prob * 0.6) jitter = 0;

                for (let x = 0; x < width; x++) {
                    let srcX = (x + jitter + width) % width;
                    let dstIdx = (y * width + x) * 4;
                    let srcIdx = (y * width + srcX) * 4;
                    pixels[dstIdx] = src[srcIdx];
                    pixels[dstIdx+1] = src[srcIdx+1];
                    pixels[dstIdx+2] = src[srcIdx+2];
                    pixels[dstIdx+3] = src[srcIdx+3];
                }
            }
            updatePixels();
        }

        // ===================================================================
        // P5.JS LIFECYCLE
        // ===================================================================

        let particles = [];
        let time = 0;

        function setup() {
            let canvas = createCanvas(800, 800);
            canvas.parent('canvas-container');
            colorMode(HSB, 360, 100, 100, 100);
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            time = 0;
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle());
            }
            background(0);
        }

        function draw() {
            // Trail fade
            blendMode(BLEND);
            noStroke();
            fill(0, 0, 0, params.trailAlpha);
            rect(0, 0, width, height);

            // Draw particles with additive blending
            blendMode(ADD);
            time += 0.01;
            for (let p of particles) {
                p.update(time);
                p.display();
            }
            blendMode(BLEND);

            // === GLITCH CORRUPTION LAYERS ===
            // Applied in sequence: RGB split -> Pixel sort -> Scanlines
            // Each modulated by shared time variable at different harmonic frequencies

            applyRGBSplit(time);
            applyPixelSort(time);
            applyScanlines(time);
        }

        // ===================================================================
        // UI HANDLERS
        // ===================================================================

        function updateParam(paramName, value) {
            let numVal = parseFloat(value);
            if (['particleCount', 'rgbSplit', 'sortAmount', 'scanlineJitter', 'sortThreshLow', 'sortThreshHigh', 'trailAlpha'].includes(paramName)) {
                numVal = parseInt(value);
            }
            params[paramName] = numVal;
            let displayVal = value;
            if (paramName === 'sortAmount') displayVal = value + '%';
            document.getElementById(paramName + '-value').textContent = displayVal;

            if (paramName === 'particleCount') {
                initializeSystem();
            }
        }

        // ===================================================================
        // SEED CONTROLS (FIXED)
        // ===================================================================

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('rgbSplit').value = params.rgbSplit;
            document.getElementById('rgbSplit-value').textContent = params.rgbSplit;
            document.getElementById('sortAmount').value = params.sortAmount;
            document.getElementById('sortAmount-value').textContent = params.sortAmount + '%';
            document.getElementById('scanlineJitter').value = params.scanlineJitter;
            document.getElementById('scanlineJitter-value').textContent = params.scanlineJitter;
            document.getElementById('glitchSpeed').value = params.glitchSpeed;
            document.getElementById('glitchSpeed-value').textContent = params.glitchSpeed;
            document.getElementById('sortThreshLow').value = params.sortThreshLow;
            document.getElementById('sortThreshLow-value').textContent = params.sortThreshLow;
            document.getElementById('sortThreshHigh').value = params.sortThreshHigh;
            document.getElementById('sortThreshHigh-value').textContent = params.sortThreshHigh;
            document.getElementById('trailAlpha').value = params.trailAlpha;
            document.getElementById('trailAlpha-value').textContent = params.trailAlpha;
            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('entropic-signal-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
